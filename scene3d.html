<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三维自习室 - 校园自习室信息与数据展示中心</title>
  <link rel="stylesheet" href="libs/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-campus">
    <div class="container">
      <a class="navbar-brand" href="index.html">校园自习室展示中心</a>
      <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="rooms.html">自习室查询</a></li>
          <li class="nav-item"><a class="nav-link" href="charts.html">数据可视化</a></li>
          <li class="nav-item"><a class="nav-link" href="scene3d.html">三维自习室</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h1 class="h3 mb-3">三维自习室</h1>

    <!-- 数据加载错误提示区域 -->
    <div id="scene-error"></div>

    <div class="row g-3">
      <div class="col-12 col-lg-9">
        <!-- 三维画布容器 -->
        <div id="scene-container"></div>
        <p class="text-muted small mt-2">
          操作提示：按住鼠标左键拖动旋转视角，滚轮缩放，按住右键拖动平移；点击座位查看状态。
        </p>
      </div>
      <div class="col-12 col-lg-3">
        <div class="card p-3 mb-3">
          <label for="room-select" class="form-label">选择自习室</label>
          <select id="room-select" class="form-select"></select>
        </div>
        <!-- 图例 -->
        <div class="card p-3 mb-3">
          <h2 class="h6">图例</h2>
          <div class="d-flex align-items-center mb-1">
            <span class="d-inline-block me-2" style="width:16px;height:16px;background:#2ec27e;border-radius:3px;"></span>空闲座位
          </div>
          <div class="d-flex align-items-center">
            <span class="d-inline-block me-2" style="width:16px;height:16px;background:#e01b24;border-radius:3px;"></span>已占用座位
          </div>
        </div>
        <!-- 点击座位后的信息面板 -->
        <div class="card p-3" id="seat-info">
          <h2 class="h6">座位信息</h2>
          <p class="text-muted small mb-0" id="seat-info-text">点击场景中的座位查看详情。</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer text-center">
    <div class="container">
      <p class="mb-0">校园自习室信息与数据展示中心 &copy; <span id="footer-year"></span> | 软件开发综合实践期末大作业</p>
    </div>
  </footer>

  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/three.min.js"></script>
  <script src="libs/OrbitControls.js"></script>
  <script src="js/common.js"></script>
  <script src="js/scene3d.js"></script>
</body>
</html>
